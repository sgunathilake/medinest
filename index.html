'use strict';const KEY='medinest_v1';let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{};if(!data||!Array.isArray(data.people)||!Array.isArray(data.meds)||!Array.isArray(data.logs))data={people:[],meds:[],logs:[]};let tab='home',filter='all',search='';const $=s=>document.querySelector(s),today=()=>new Date().toLocaleDateString('en-CA'),uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),person=id=>data.people.find(p=>p.id===id)?.name||'Unknown',save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch{alert('Unable to save locally. Export a backup and check available storage.')}render()},days=s=>s?Math.ceil((new Date(s+'T12:00:00')-new Date(today()+'T12:00:00'))/86400000):null,validTime=t=>/^([01]\d|2[0-3]):[0-5]\d$/.test(t),times=m=>(m.times||[]).filter(validTime),due=()=>data.meds.filter(m=>m.active&&times(m).length).flatMap(m=>times(m).map(t=>({m,t,log:data.logs.find(l=>l.medId===m.id&&l.date===today()&&l.time===t)}))).sort((a,b)=>a.t.localeCompare(b.t));function openDialog(html){$('#dialogbody').innerHTML=html;$('#dialog').showModal()}function closeDialog(){$('#dialog').close()}function switchTab(t){tab=t;render()}function render(){let names={home:'Dashboard',cabinet:'Cabinet',schedule:'Schedule',people:'People',settings:'Settings'};$('#tabs').innerHTML=Object.entries(names).map(([k,v])=>`<button class="${tab===k?'active':''}" onclick="switchTab('${k}')">${v}</button>`).join('');$('#headprofile').textContent=data.people.length+' profile'+(data.people.length===1?'':'s');$('#content').innerHTML=({home:homeView,cabinet:cabinetView,schedule:scheduleView,people:peopleView,settings:settingsView}[tab])()}
function status(m){let d=days(m.expiry);if(d!==null&&d<0)return '<span class="pill bad">Expired</span>';if(d!==null&&d<=30)return '<span class="pill warning">Expiring in '+d+' days</span>';return ''}function low(m){return Number(m.quantity)<=Number(m.threshold)&&m.threshold!==''}function homeView(){let d=due(),expired=data.meds.filter(m=>days(m.expiry)!==null&&days(m.expiry)<0).length,soon=data.meds.filter(m=>days(m.expiry)!==null&&days(m.expiry)>=0&&days(m.expiry)<=30).length;return `<h2>Welcome to MediNest</h2><div class="grid"><div class="card"><div class="muted">Medicines</div><div class="stat">${data.meds.length}</div></div><div class="card"><div class="muted">Today's scheduled doses</div><div class="stat">${d.length}</div><small>${d.filter(x=>x.log?.status==='taken').length} marked taken</small></div><div class="card"><div class="muted">Expiring / expired</div><div class="stat">${soon+expired}</div></div><div class="card"><div class="muted">Low stock</div><div class="stat">${data.meds.filter(low).length}</div></div></div><div class="card"><h3>Today's checklist</h3>${doseList(d)}</div><div class="card"><h3>Quick actions</h3><div class="actions"><button onclick="addMedicine()">+ Add medicine</button><button class="secondary" onclick="scanMedicine()">📷 Scan packaging</button><button class="secondary" onclick="addPerson()">+ Add person</button><button class="secondary" onclick="switchTab('cabinet')">View cabinet</button></div></div><div class="notice">MediNest does not determine safe doses, interactions or whether to take a missed dose. Follow the label or your clinician's advice. This version does not provide background notifications.</div>`}
function doseList(arr){return arr.length?arr.map(({m,t,log})=>`<div class="item"><strong>${esc(t)} · ${esc(m.name)}</strong> <span class="muted">${esc(m.strength||'')} · ${esc(person(m.personId))}</span><p class="muted">${esc(m.instructions||'Follow your prescription label')}</p><span class="pill ${log?.status==='skipped'?'warning':''}">${log?esc(log.status):'Not recorded'}</span><div class="actions"><button class="secondary" onclick="record('${m.id}','${t}','taken')">Mark taken</button><button class="secondary" onclick="record('${m.id}','${t}','skipped')">Mark skipped</button><button class="secondary" onclick="record('${m.id}','${t}','clear')">Clear</button></div></div>`).join(''):'<p class="muted">No medicines scheduled for today. Add a medicine with daily times to populate this list.</p>'}function record(id,time,status){data.logs=data.logs.filter(l=>!(l.medId===id&&l.date===today()&&l.time===time));if(status!=='clear')data.logs.push({id:uid(),medId:id,date:today(),time,status,recordedAt:new Date().toISOString()});save()}
function cabinetView(){let meds=data.meds.filter(m=>(filter==='all'||m.personId===filter)&&[m.name,m.strength,m.location,m.notes].join(' ').toLowerCase().includes(search.toLowerCase()));return `<h2>Medicine cabinet</h2><div class="card"><div class="actions"><button onclick="addMedicine()">+ Add medicine</button><button class="secondary" onclick="scanMedicine()">📷 Scan packaging</button></div><label>Search medicines</label><input id="search" placeholder="Name, strength, location..." value="${esc(search)}" oninput="search=this.value;updateCabinetResults()"><label>Person</label><select onchange="filter=this.value;updateCabinetResults()"><option value="all">Everyone</option>${data.people.map(p=>`<option value="${p.id}" ${filter===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div id="medresults">${medicineResults(meds)}</div>`}function updateCabinetResults(){let meds=data.meds.filter(m=>(filter==='all'||m.personId===filter)&&[m.name,m.strength,m.location,m.notes].join(' ').toLowerCase().includes(search.toLowerCase()));$('#medresults').innerHTML=medicineResults(meds)}function medicineResults(meds){return meds.length?meds.map(m=>`<div class="card"><h3>${esc(m.name)} <span class="muted">${esc(m.strength)}</span></h3><span class="pill">${esc(person(m.personId))}</span>${status(m)}${low(m)?'<span class="pill warning">Low stock</span>':''}${!m.active?'<span class="pill">Inactive</span>':''}<p class="muted">Quantity: ${esc(m.quantity)} ${esc(m.unit)} · Storage: ${esc(m.location||'Not specified')} · Expiry: ${esc(m.expiry||'Not recorded')}</p><p>${esc(m.instructions||'No instructions recorded')}</p><div class="actions"><button class="secondary" onclick="addMedicine('${m.id}')">Edit</button><button class="danger" onclick="deleteMed('${m.id}')">Delete</button></div></div>`).join(''):'<div class="card muted">No medicines found.</div>'}function scheduleView(){let hist=[...data.logs].sort((a,b)=>b.recordedAt.localeCompare(a.recordedAt)).slice(0,30);return `<h2>Daily schedule</h2><div class="card"><h3>${esc(today())}</h3>${doseList(due())}</div><div class="card"><h3>Recent recorded history</h3>${hist.length?hist.map(l=>`<div class="item">${esc(l.date)} ${esc(l.time)} · ${esc(data.meds.find(m=>m.id===l.medId)?.name||'Deleted medicine')} · <strong>${esc(l.status)}</strong></div>`).join(''):'<p class="muted">No recorded doses yet.</p>'}</div>`}function peopleView(){return `<h2>Household profiles</h2><div class="card"><button onclick="addPerson()">+ Add person</button><p class="muted">Profiles separate records visually, but do not restrict who can read them on this device.</p></div>${data.people.map(p=>`<div class="card"><h3>${esc(p.name)}</h3><p class="muted">${data.meds.filter(m=>m.personId===p.id).length} medicines</p><div class="actions"><button class="secondary" onclick="addPerson('${p.id}')">Rename</button><button class="danger" onclick="deletePerson('${p.id}')">Delete profile</button></div></div>`).join('')||'<div class="card">Create your first profile to get started.</div>'}`}
function settingsView(){return `<h2>Settings and data</h2><div class="card"><h3>Optional cloud AI scanner (v0.4)</h3><p class="muted">Only photos you explicitly submit are sent to your Cloudflare Worker and the AI provider. Your medicine cabinet stays in this browser. Do not scan labels with names, addresses or NHS numbers.</p><label>Cloudflare Worker HTTPS address</label><input id="aiendpoint" placeholder="https://medinest-ai.yourname.workers.dev" value="${esc(localStorage.getItem('medinest_ai_endpoint')||'')}"><div class="actions"><button onclick="saveAISettings()">Save AI address</button></div><p class="muted">Your private access code is entered each time you open the scanner. Never put your Gemini API key here or in GitHub.</p></div><div class="card"><h3>Backups</h3><p class="muted">Export your data regularly. Backup files contain sensitive medication information in readable JSON; store them securely.</p><div class="actions"><button onclick="exportData()">Export backup</button><button class="secondary" onclick="$('#importfile').click()">Restore backup</button><input id="importfile" class="hidden" type="file" accept="application/json,.json" onchange="importData(this.files[0])"></div></div><div class="card"><h3>Privacy</h3><p>All records are stored in this browser's local storage. There is no account, analytics, cloud sync or automatic sharing. Clearing browser data can permanently erase records.</p><button class="danger" onclick="clearData()">Erase all local data</button></div><div class="card"><h3>Medical information</h3><p>Use the <a href="https://www.nhs.uk/medicines/" target="_blank" rel="noopener noreferrer">NHS Medicines A–Z</a> for general medicine information. Check your own prescription and packaging for instructions.</p><p class="muted">Daily schedule only. No clinical dose checking, automatic interaction checking, verified medication database, or guaranteed reminders.</p></div>`}
function addPerson(id){let p=data.people.find(x=>x.id===id);openDialog(`<h2>${p?'Edit':'Add'} person</h2><form id="personform"><label>Display name</label><input name="name" maxlength="80" required value="${esc(p?.name||'')}"><div class="actions"><button>Save</button><button type="button" class="secondary" onclick="closeDialog()">Cancel</button></div></form>`);$('#personform').onsubmit=e=>{e.preventDefault();let name=e.target.elements.name.value.trim();if(!name)return;if(p)p.name=name;else data.people.push({id:uid(),name});closeDialog();save()}}
function addMedicine(id){if(!data.people.length){alert('Add a household profile first.');addPerson();return}let m=data.meds.find(x=>x.id===id)||{};openDialog(`<h2>${id?'Edit':'Add'} medicine</h2><form id="medform"><div class="actions"><button type="button" class="secondary" onclick="scanMedicine(true)">📷 Scan photos to fill form</button></div><div class="grid"><div><label>Medicine name *</label><input name="name" required maxlength="120" value="${esc(m.name||'')}"></div><div><label>For person *</label><select name="personId" required>${data.people.map(p=>`<option value="${p.id}" ${m.personId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div><label>Strength (e.g. 500 mg)</label><input name="strength" maxlength="80" value="${esc(m.strength||'')}"></div><div><label>Quantity in stock</label><input name="quantity" type="number" min="0" step="0.01" value="${esc(m.quantity??0)}"></div><div><label>Unit (tablets, bottles...)</label><input name="unit" maxlength="40" value="${esc(m.unit||'tablets')}"></div><div><label>Low-stock threshold</label><input name="threshold" type="number" min="0" step="0.01" value="${esc(m.threshold??5)}"></div><div><label>Expiry date</label><input name="expiry" type="date" value="${esc(m.expiry||'')}"></div><div><label>Storage location</label><input name="location" maxlength="100" value="${esc(m.location||'')}"></div><div><label>Daily times (24-hour HH:MM, comma separated)</label><input name="times" placeholder="08:00, 20:00" value="${esc((m.times||[]).join(', '))}"></div><div><label>Status</label><select name="active"><option value="yes" ${m.active!==false?'selected':''}>Active</option><option value="no" ${m.active===false?'selected':''}>Inactive</option></select></div></div><label>Instructions from label / clinician</label><textarea name="instructions">${esc(m.instructions||'')}</textarea><label>Notes</label><textarea name="notes">${esc(m.notes||'')}</textarea><div class="notice">Only enter prescribed or verified instructions. Times are a checklist, not medical advice or a notification service.</div><div class="actions"><button>Save medicine</button><button type="button" class="secondary" onclick="closeDialog()">Cancel</button></div></form>`);$('#medform').onsubmit=e=>{e.preventDefault();let f=e.target.elements,ts=f.times.value.split(',').map(x=>x.trim()).filter(Boolean);if(ts.some(x=>!validTime(x))){alert('Use 24-hour times like 08:00, 20:00.');return}let v={id:m.id||uid(),name:f.name.value.trim(),personId:f.personId.value,strength:f.strength.value.trim(),quantity:Number(f.quantity.value||0),unit:f.unit.value.trim(),threshold:Number(f.threshold.value||0),expiry:f.expiry.value,location:f.location.value.trim(),times:[...new Set(ts)],active:f.active.value==='yes',instructions:f.instructions.value.trim(),notes:f.notes.value.trim()};if(!v.name)return;if(id)Object.assign(m,v);else data.meds.push(v);closeDialog();save()}}
function deleteMed(id){if(confirm('Delete this medicine and its dose history?')){data.meds=data.meds.filter(m=>m.id!==id);data.logs=data.logs.filter(l=>l.medId!==id);save()}}function deletePerson(id){if(data.meds.some(m=>m.personId===id)){alert('Delete or reassign this person’s medicines first.');return}if(confirm('Delete this profile?')){data.people=data.people.filter(p=>p.id!==id);save()}}function exportData(){let blob=new Blob([JSON.stringify({format:'medinest',version:1,exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='medinest-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importData(file){if(!file)return;try{if(file.size>5e6)throw Error('File is too large');let obj=JSON.parse(await file.text());if(obj.format!=='medinest'||obj.version!==1||!obj.data||!Array.isArray(obj.data.people)||!Array.isArray(obj.data.meds)||!Array.isArray(obj.data.logs))throw Error('Not a valid MediNest backup');if(!confirm('Replace ALL current local data with this backup?'))return;data=obj.data;save()}catch(e){alert('Restore failed: '+e.message)}}function clearData(){if(confirm('Permanently erase ALL MediNest data on this browser?')&&confirm('Are you absolutely sure? Export a backup first.')){data={people:[],meds:[],logs:[]};save()}}
function saveAISettings(){let v=$('#aiendpoint').value.trim().replace(/\/$/,'');if(v&&!/^https:\/\/[a-z0-9.-]+(?::443)?$/i.test(v)){alert('Enter only the HTTPS Worker address, without /scan.');return}if(v)localStorage.setItem('medinest_ai_endpoint',v);else localStorage.removeItem('medinest_ai_endpoint');alert('AI address saved on this device.');}
let scanReturnToForm=false;
function scanMedicine(fromForm=false){
 scanReturnToForm=fromForm;
 openDialog(`<h2>📷 Scan medicine packaging</h2><p class="muted">Choose clear photos in this order: FRONT of box first, then back, then expiry label. Choose up to 6 photos of the SAME medicine. Cloud AI sends the selected photos to your configured AI service only when you click Analyse. Local OCR requires an initial internet download.</p><label>Medicine photos (multiple allowed)</label><input id="scanfiles" type="file" accept="image/*" multiple><div class="notice">Scanned information can be incorrect. Verify the medicine name, strength, expiry and all instructions against the original packaging. Never infer dosing from OCR.</div><label>Private scanner access code (not your Gemini API key)</label><input id="aicode" type="password" autocomplete="off" placeholder="Only needed for cloud AI"><div class="actions"><button type="button" id="aistart" onclick="runAIScan()">✨ Analyse all photos with AI</button><button type="button" class="secondary" id="scanstart" onclick="runScan()">Offline-style OCR</button><button type="button" class="secondary" onclick="closeDialog()">Cancel</button></div><p id="scanprogress" role="status" aria-live="polite"></p><div id="scanresult"></div>`);
}
function loadOCR(){return new Promise((resolve,reject)=>{if(window.Tesseract)return resolve();let sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';sc.onload=resolve;sc.onerror=()=>reject(Error('OCR library could not load. Check your internet connection.'));document.head.appendChild(sc)})}
function extractFields(raw, photoTexts=[]){
 // Use the first photograph (ideally the front of the pack) for name detection.
 // Never treat OCR as verified medicine identification.
 const first=photoTexts[0]||raw;
 const cleanLines=t=>t.split(/\r?\n/).map(x=>x.replace(/\s+/g,' ').trim()).filter(x=>x.length>=3);
 const lines=cleanLines(first);
 const strength=raw.match(/\b\d+(?:[.,]\d+)?\s?(?:mg|mcg|µg|g|ml|IU|units)\b/i)?.[0]||'';
 const exp=raw.match(/(?:EXP(?:IRY|IRES)?|USE BY|BEST BEFORE)\s*[:.\-]?\s*(\d{1,2})[\/\.\-](\d{2,4})/i);
 let expiry='';if(exp){let mm=+exp[1],yy=+exp[2];if(yy<100)yy+=2000;if(mm>=1&&mm<=12&&yy>=2020&&yy<=2100)expiry=`${yy}-${String(mm).padStart(2,'0')}-${new Date(yy,mm,0).getDate()}`}
 const ignore=/\b(warning|keep out|read the|batch|lot no|expiry|exp\b|ingredients|medicine|store below|each tablet|take one|take two|for oral|do not|contains|manufactured|distributed|marketing authorisation|product licence|patient information|leaflet|children|adult use|film.coated|sugar.free|pharmaceutical|limited|ltd|plc|www\.|https?:|barcode|scan me|side effects|directions|dosage|keep this|out of reach)\b/i;
 const candidates=lines.map((line,index)=>{
   let x=line.replace(/^[^a-zA-Z]+/,'').trim();
   let words=x.match(/[A-Za-z][A-Za-z'-]{2,}/g)||[];
   if(x.length>55||words.length>6||words.length===0||ignore.test(x)||/\b(?:\d{4,}|\d+\s*(?:tablets?|capsules?|ml|mg))\b/i.test(x))return null;
   if(/\b(?:tablet|capsule|caplet|sachet|solution|suspension|cream|ointment)\b/i.test(x)&&words.length>3)return null;
   let score=0;
   if(index<8)score+=Math.max(0,8-index);
   if(words.length<=3)score+=3;
   if(x===x.toUpperCase()&&x.length>3)score+=2;
   if(/[A-Za-z]{4,}/.test(x))score+=2;
   if(/\b(?:tablets?|capsules?|mg|ml)\b/i.test(x))score-=2;
   return {text:x,score};
 }).filter(Boolean).sort((x,y)=>y.score-x.score);
 // Ambiguous packaging is safer to leave blank than to assert a wrong name.
 let name=candidates[0]?.text||'';
 if(candidates.length>1&&candidates[0].score-candidates[1].score<=1)name='';
 // Only infer pack count when packaging explicitly indicates it, not from dose directions.
 const countPatterns=[
   /\b(?:pack(?:\s+size)?|contents|contains|quantity|qty|net\s+contents)\s*[:\-]?\s*(\d{1,3})\s*(tablets?|capsules?|caplets?|softgels?|sachets?|patches?)\b/ig,
   /\b(?:pack of|box of)\s*(\d{1,3})\s*(tablets?|capsules?|caplets?|softgels?|sachets?|patches?)\b/ig,
   /(?:^|\n)\s*(\d{1,3})\s*(tablets?|capsules?|caplets?|softgels?|sachets?|patches?)\s*(?:\n|$)/ig
 ];
 const counts=[];
 for(const pattern of countPatterns){for(const match of raw.matchAll(pattern)){
   const n=+match[1];if(n>=1&&n<=500)counts.push({n,unit:match[2],context:match[0].trim()});
 }}
 const unique=[...new Set(counts.map(x=>x.n))];
 const quantity=unique.length===1?String(unique[0]):'';
 const unit=unique.length===1?counts[0].unit:'';
 return {name,strength,expiry,quantity,unit,nameCandidates:candidates.slice(0,5).map(x=>x.text),countCandidates:counts.slice(0,8)};
}
async function shrinkPhoto(file){return new Promise((resolve,reject)=>{let url=URL.createObjectURL(file),img=new Image();img.onload=()=>{try{let max=1400,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));let ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',0.78).split(',')[1]);}catch(e){reject(e)}finally{URL.revokeObjectURL(url)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Could not read photo'))};img.src=url})}
function showScanReview(v,raw,source){const val=k=>esc(v[k]??'');$('#scanresult').innerHTML=`<h3>Review ${esc(source)} suggestions</h3><div class="notice">AI may be wrong even when confident. Confirm every field from the original box. Unknown fields are intentionally blank. Do not use the app to decide doses.</div><form id="scanreview"><label>Medicine name</label><input name="name" required value="${val('name')}"><label>Strength</label><input name="strength" value="${val('strength')}"><label>Quantity in pack (not remaining stock)</label><input name="quantity" type="number" min="0" step="1" value="${val('quantity')}"><label>Unit</label><input name="unit" value="${val('unit')}"><label>Expiry (confirm day/month/year)</label><input name="expiry" type="date" value="${val('expiry')}"><label>Packaging evidence / warnings</label><textarea readonly style="min-height:115px">${esc(raw)}</textarea><div class="actions"><button type="submit">Use verified details</button></div></form>`;$('#scanreview').onsubmit=e=>{e.preventDefault();let f=e.target.elements;let reviewed={name:f.name.value.trim(),strength:f.strength.value.trim(),quantity:f.quantity.value,unit:f.unit.value.trim(),expiry:f.expiry.value};closeDialog();addMedicine();let form=$('#medform');for(let [k,v] of Object.entries(reviewed))if(v&&form.elements.namedItem(k))form.elements.namedItem(k).value=v;let note=document.createElement('div');note.className='notice';note.textContent='Check quantity means actual remaining stock, not merely pack size. Set the correct person. Enter daily times and instructions manually from the label or clinician.';form.prepend(note)};}
async function runAIScan(){let endpoint=localStorage.getItem('medinest_ai_endpoint');if(!endpoint){alert('First open Settings and save your Cloudflare Worker address.');return}let code=$('#aicode').value,files=[...($('#scanfiles')?.files||[])];if(!code){alert('Enter the private scanner access code.');return}if(!files.length||files.length>6){alert('Choose 1–6 photos of the same medicine.');return}if(files.some(f=>!f.type.startsWith('image/')||f.size>12e6)){alert('Use image files under 12 MB each.');return}if(!confirm('Send '+files.length+' selected photo(s) to your Cloudflare Worker and Google Gemini for AI analysis? Remove any personal information first.'))return;let btn=$('#aistart');btn.disabled=true;try{$('#scanprogress').textContent='Preparing images locally…';let images=[];for(let i=0;i<files.length;i++)images.push({mimeType:'image/jpeg',data:await shrinkPhoto(files[i])});$('#scanprogress').textContent='Sending selected photos for AI analysis…';let controller=new AbortController(),timer=setTimeout(()=>controller.abort(),60000);let response;try{response=await fetch(endpoint+'/scan',{method:'POST',headers:{'Content-Type':'application/json','X-MediNest-Code':code},body:JSON.stringify({images}),signal:controller.signal})}finally{clearTimeout(timer)}let result=await response.json().catch(()=>({error:'Unexpected server response'}));if(!response.ok)throw Error(result.error||'AI service returned '+response.status);let v=result.fields||{};$('#scanprogress').textContent='AI suggestions received. Please review against the original packaging.';showScanReview(v,JSON.stringify({evidence:result.evidence||{},uncertain:result.uncertain||[]},null,2),'AI');}catch(err){$('#scanprogress').textContent='AI scan failed: '+err.message+'. You can still use local OCR or manual entry.'}finally{if(btn?.isConnected)btn.disabled=false}}
async function runScan(){const files=[...($('#scanfiles')?.files||[])];if(!files.length){alert('Choose at least one photo.');return}if(files.length>6){alert('Select up to 6 photos at a time.');return}if(files.some(f=>!f.type.startsWith('image/')||f.size>12e6)){alert('Use image files under 12 MB each.');return}let btn=$('#scanstart');btn.disabled=true;let worker;try{ $('#scanprogress').textContent='Loading text recognition…';await loadOCR();worker=await Tesseract.createWorker('eng',1,{logger:m=>{let e=$('#scanprogress');if(e)e.textContent=`${m.status||'Reading'} ${m.progress?Math.round(m.progress*100)+'%':''}`}});let results=[];for(let i=0;i<files.length;i++){ $('#scanprogress').textContent=`Reading image ${i+1} of ${files.length}…`;let r=await worker.recognize(files[i]);results.push(r.data.text)}let raw=results.join('\n\n');let v=extractFields(raw,results);$('#scanprogress').textContent='Finished. Check every extracted value before saving.';$('#scanresult').innerHTML=`<h3>Review detected details</h3><p class="muted">Suggestions are unverified. Blank name or quantity means the scanner could not choose safely. Check the box before saving.</p><p class="muted">Possible name lines: ${esc(v.nameCandidates.join(" | ")||"none")}</p><p class="muted">Pack-count evidence: ${esc(v.countCandidates.map(x=>x.context).join(" | ")||"none")}</p><form id="scanreview"><label>Medicine name</label><input name="name" value="${esc(v.name)}"><label>Strength</label><input name="strength" value="${esc(v.strength)}"><label>Quantity</label><input name="quantity" type="number" min="0" value="${esc(v.quantity)}"><label>Unit</label><input name="unit" value="${esc(v.unit)}"><label>Expiry (check day/month/year)</label><input name="expiry" type="date" value="${esc(v.expiry)}"><label>Recognised text (for reference only)</label><textarea readonly style="min-height:160px">${esc(raw.slice(0,12000))}</textarea><div class="actions"><button type="submit">Use reviewed details</button></div></form>`;$('#scanreview').onsubmit=e=>{e.preventDefault();let f=e.target.elements;let reviewed={name:f.name.value.trim(),strength:f.strength.value.trim(),quantity:f.quantity.value,unit:f.unit.value.trim(),expiry:f.expiry.value};closeDialog();addMedicine();let form=$('#medform');for(let [k,v] of Object.entries(reviewed)){if(v&&form.elements.namedItem(k))form.elements.namedItem(k).value=v}let note=document.createElement('div');note.className='notice';note.textContent='Photo scan filled some fields. Verify all details and select the correct person before saving. Instructions and daily times must be entered manually from the label or clinician.';form.prepend(note)};
 }catch(err){let el=$('#scanprogress');if(el)el.textContent='Scan failed: '+err.message+'. You can still enter medicine details manually.'}finally{if(worker)await worker.terminate();if(btn?.isConnected)btn.disabled=false}}

render();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
